<title>Dots &amp; Daubs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --ground:#171514;
    --panel:#201d1b;
    --panel-2:#262220;
    --line:#322e2a;
    --text:#ede8e1;
    --muted:#989086;
    --accent:#b8b1a7;
    --accent-ink:#1c1814;
    --stage:#100e0d;
    --sans:'Instrument Sans',system-ui,sans-serif;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --disp:'Fraunces',Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--text);
    font-family:var(--sans);font-size:14px;line-height:1.45;
  }
  .app{display:grid;grid-template-columns:322px 1fr;height:100vh}

  /* ---------- sidebar ---------- */
  .side{
    background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .brand{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
  .brand h1{
    font-family:var(--disp);font-style:italic;font-weight:600;
    font-size:26px;margin:0;letter-spacing:.01em;color:var(--text);
  }
  .brand h1 .amp{color:var(--accent)}
  .brand p{margin:2px 0 0;color:var(--muted);font-size:12px;letter-spacing:.04em}

  .controls{flex:1;overflow-y:auto;padding:14px 20px 20px;min-height:0}
  .controls::-webkit-scrollbar{width:10px}
  .controls::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}

  .group{margin-bottom:22px}
  .group-label{
    text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;
    font-weight:600;color:var(--muted);margin:0 0 10px;
  }

  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:8px;padding:4px}
  .tabs button{
    appearance:none;border:0;background:transparent;color:var(--muted);
    font:inherit;font-size:12.5px;font-weight:500;padding:7px 2px;border-radius:5px;cursor:pointer;
  }
  .tabs button:hover{color:var(--text)}
  .tabs button.on{background:#3a352f;color:var(--text);font-weight:600}

  .ctl{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
  .ctl-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .ctl-head label{font-size:12.5px;color:var(--text)}
  .ctl-head .val{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  input[type=range]{
    appearance:none;-webkit-appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--text);margin-top:-5.5px;border:none;
  }
  input[type=range]:hover::-webkit-slider-thumb,
  input[type=range]:focus-visible::-webkit-slider-thumb{background:var(--accent)}
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--text);border:none}
  input[type=range]:hover::-moz-range-thumb{background:var(--accent)}

  select,input[type=color]{
    width:100%;background:var(--panel-2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:7px 9px;font:inherit;font-size:12.5px;cursor:pointer;
  }
  input[type=color]{padding:3px;height:32px}

  .seg{display:grid;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:3px}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;
    font-size:12px;padding:6px 4px;border-radius:4px;cursor:pointer}
  .seg button:hover{color:var(--text)}
  .seg button.on{background:#3a352f;color:var(--text);font-weight:500}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .btn{
    appearance:none;border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    font:inherit;font-size:13px;font-weight:500;padding:9px 12px;border-radius:7px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  }
  .btn:hover{border-color:#4a443c}
  .btn.primary{background:#33302c;border-color:#4a443c;color:var(--text);font-weight:600}
  .btn.primary:hover{background:#3c3833;border-color:#585144}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .palette-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{width:30px;height:30px;border-radius:6px;border:1px solid rgba(255,255,255,.14);
    display:flex;align-items:flex-end;justify-content:center;font-family:var(--mono);font-size:9px;
    padding-bottom:1px;cursor:default}
  .chip.small{width:14px;height:14px;border-radius:3px;font-size:0}

  .exports{padding:14px 20px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

  /* ---------- stage ---------- */
  .stage{
    background:var(--stage);position:relative;min-width:0;min-height:0;
    display:flex;flex-direction:column;
  }
  .stage-top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 22px;border-bottom:1px solid var(--line);
  }
  .stage-top .meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .stage-top .meta b{color:var(--text);font-weight:500}
  .up-cluster{display:flex;gap:8px}
  .up-cluster .btn{width:auto;padding:7px 14px}

  .canvas-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:28px;min-height:0}
  canvas#preview{
    max-width:100%;max-height:100%;border-radius:2px;
    box-shadow:0 24px 60px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4);
  }

  .drop-veil{
    position:absolute;inset:0;background:rgba(23,21,20,.9);border:2px dashed var(--muted);
    display:none;align-items:center;justify-content:center;z-index:20;
    font-family:var(--disp);font-style:italic;font-size:26px;color:var(--text);pointer-events:none;
  }
  body.dragging .drop-veil{display:flex}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);
    background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:40;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}

  @media (max-width:860px){
    .app{grid-template-columns:1fr;grid-template-rows:minmax(46vh,1fr) auto;height:auto;min-height:100vh}
    .stage{order:0;min-height:46vh}
    .side{order:1;border-right:0;border-top:1px solid var(--line)}
    .controls{overflow:visible}
  }
</style>

<div class="app">
  <aside class="side">
    <div class="brand">
      <h1>Dots <span class="amp">&amp;</span> Daubs</h1>
      <p>photo &rarr; shapes &rarr; paint</p>
    </div>
    <div class="controls" id="controls"></div>
    <div class="exports">
      <button class="btn primary" id="exp-svg">Export SVG</button>
      <div class="row2">
        <button class="btn" id="exp-png">Export PNG</button>
        <button class="btn" id="exp-guide">Painter&rsquo;s guide</button>
      </div>
    </div>
  </aside>

  <main class="stage">
    <div class="stage-top">
      <div class="meta" id="meta">&mdash;</div>
      <div class="up-cluster">
        <button class="btn" id="btn-shuffle" title="New random seed">&#127922; Shuffle</button>
        <button class="btn primary" id="btn-upload">Open photo&hellip;</button>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
    </div>
    <div class="canvas-wrap"><canvas id="preview"></canvas></div>
    <div class="drop-veil">drop your photo</div>
  </main>
</div>
<div class="toast" id="toast"></div>

  // dominant hue: saturation-weighted circular mean
  let sx=0,sy=0;
  hsl.forEach(c=>{sx+=Math.cos(c[0]*2*Math.PI)*c[1];sy+=Math.sin(c[0]*2*Math.PI)*c[1]});
  const dom=((Math.atan2(sy,sx)/(2*Math.PI))%1+1)%1;
  const poles=mode==='refine'?null:{
    analogous:[dom-1/12,dom,dom+1/12],
    complement:[dom,dom+0.5],
    triadic:[dom,dom+1/3,dom+2/3],
    tonal:[dom],
  }[mode].map(h=>((h%1)+1)%1);
  const pull=(mode==='tonal'?0.9:0.72)*k;
  const smean=hsl.reduce((a,c)=>a+c[1],0)/hsl.length;
  const out=hsl.map(([h,s,l])=>{
    if(s>0.06){ // leave near-neutrals as greys
      if(poles){
        let best=poles[0],bd=1;
        for(const p of poles){const d=hueDist(h,p);if(d<bd){bd=d;best=p}}
        h=hueMix(h,best,pull);
      }
      s+= (smean-s)*(mode==='tonal'?0.55:mode==='refine'?0.45:0.3)*k;
      if(mode==='complement')s=Math.min(1,s*(1+0.12*k));
    }
    return[h,s,l];
  });
  // even out the lightness ladder (blend toward equal steps)
  const order=out.map((c,i)=>i).sort((a,b)=>out[a][2]-out[b][2]);
  const lmin=out[order[0]][2], lmax=out[order[order.length-1]][2];
  const lk=(mode==='refine'?0.7:0.5)*k;
  order.forEach((idx,rank)=>{
    if(order.length<2)return;
    const target=lmin+(lmax-lmin)*rank/(order.length-1);
    out[idx][2]+=(target-out[idx][2])*lk;
  });
  return out.map(hsl2rgb).sort((a,b)=>lum(a)-lum(b));
}

function snap(c){
  if(!palette)return c;
  let best=null,bd=1e9;
  for(const p of palette){
    const d=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2;
    if(d<bd){bd=d;best=p}
  }
  return best;
}

/* ========================= shape generation ======================== */
/* Shapes live in art space (sample.w x sample.h).
   {kind:'circle',cx,cy,r,fill} {kind:'rect',x,y,w,h,rx,fill} {kind:'poly',pts,fill}
   fill: {c:[r,g,b]} or {g:{c1,c2,x1,y1,x2,y2}} */
let shapes=[];

function fillFor(cx,cy,size){
  const base=col=>({c:snap(col)});
  if(S.grad==='off') return r=>base(r);
  const ang=S.gradAngle*Math.PI/180, dx=Math.cos(ang),dy=Math.sin(ang);
  const off=size*0.32, sr=Math.max(2,size*0.18);
  const c1=snap(pointAvg(cx-dx*off,cy-dy*off,sr));
  const c2=snap(pointAvg(cx+dx*off,cy+dy*off,sr));
  const diff=Math.abs(c1[0]-c2[0])+Math.abs(c1[1]-c2[1])+Math.abs(c1[2]-c2[2]);
  if(diff<12) return r=>base(r);
  return ()=>({g:{c1,c2,x1:cx-dx*size/2,y1:cy-dy*size/2,x2:cx+dx*size/2,y2:cy+dy*size/2}});
}

function genDots(rng){
  const {w,h}=sample, cols=S.dots.cols, cell=w/cols, rows=Math.max(1,Math.round(h/cell));
  const out=[];
  for(let ry=0;ry<rows;ry++)for(let rx=0;rx<cols;rx++){
    const x0=rx*cell,y0=ry*cell*(h/(rows*cell));
    const cy0=ry*(h/rows), ch=h/rows;
    const avg=rectAvg(x0,cy0,x0+cell,cy0+ch);
    let scale=S.dots.scale/100;
    if(S.dots.sizeBy!=='none'){
      let t=lum(avg)/255;
      if(S.dots.sizeBy==='dark') t=1-t;
      scale*=0.15+0.85*t;
    }
    const j=S.dots.jitter/100*cell;
    const cx=x0+cell/2+(rng()-0.5)*j, cy=cy0+ch/2+(rng()-0.5)*j;
    const r=cell/2*scale;
    if(r<0.3)continue;
    const mk=fillFor(cx,cy,cell*scale);
    if(S.dots.shape==='circle') out.push({kind:'circle',cx,cy,r,fill:mk(avg)});
    else out.push({kind:'rect',x:cx-r,y:cy-r,w:r*2,h:r*2,rx:S.dots.shape==='rounded'?r*0.5:0,fill:mk(avg)});
  }
  return out;
}

function genMosaic(){
  const {w,h}=sample, cols=S.mosaic.cols, cell=w/cols, rows=Math.max(1,Math.round(h/cell));
  const gap=S.mosaic.gap/100*cell, out=[];
  for(let ry=0;ry<rows;ry++)for(let rx=0;rx<cols;rx++){
    const x0=rx*cell, y0=ry*(h/rows), cw=cell, ch=h/rows;
    const col=S.mosaic.colorMode==='dom'
      ? dominantColor(x0,y0,x0+cw,y0+ch)
      : rectAvg(x0,y0,x0+cw,y0+ch);
    const mk=fillFor(x0+cw/2,y0+ch/2,cw);
    out.push({kind:'rect',x:x0+gap/2,y:y0+gap/2,w:cw-gap,h:ch-gap,
      rx:(S.mosaic.radius/100)*(cw-gap)/2,fill:mk(col)});
  }
  return out;
}

function genQuad(){
  const {w,h}=sample, out=[];
  const thr=90-S.quad.detail*0.85;          // detail 0..100 -> thr 90..5
  const minSize=Math.max(4,Math.max(w,h)/160);
  // square root region centred on the image: every cell is a square,
  // edge squares crop evenly against the frame
  const side=Math.max(w,h), ox=(w-side)/2, oy=(h-side)/2;
  (function split(x,y,s,depth){
    if(x+s<=0||y+s<=0||x>=w||y>=h)return;   // fully outside the image
    const v=rectVar(x,y,x+s,y+s);
    if(depth<S.quad.maxDepth && v>thr && s>minSize*2){
      const hs=s/2;
      split(x,y,hs,depth+1);     split(x+hs,y,hs,depth+1);
      split(x,y+hs,hs,depth+1);  split(x+hs,y+hs,hs,depth+1);
    }else{
      const g=S.quad.gap/100*s*0.5;
      const col=rectAvg(x,y,x+s,y+s);
      const mk=fillFor(x+s/2,y+s/2,s);
      out.push({kind:'rect',x:x+g,y:y+g,w:s-g*2,h:s-g*2,
        rx:(S.quad.radius/100)*(s-g*2)/2,fill:mk(col)});
    }
  })(ox,oy,side,0);
  return out;
}

function genVoronoi(rng){
  if(!(window.d3&&d3.Delaunay))return[];
  const {w,h}=sample, n=S.voronoi.count, wgt=S.voronoi.weight/100;
  // detail map for weighted seeding
  const gs=10, gw=Math.ceil(w/gs), gh=Math.ceil(h/gs), vm=new Float32Array(gw*gh);
  let vmax=1e-6;
  for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){
    const v=rectVar(gx*gs,gy*gs,(gx+1)*gs,(gy+1)*gs);
    vm[gy*gw+gx]=v; if(v>vmax)vmax=v;
  }
  const pts=[];
  let guard=0;
  while(pts.length<n*2 && guard<n*60){
    guard++;
    const x=rng()*w, y=rng()*h;
    const v=vm[Math.min(gh-1,y/gs|0)*gw+Math.min(gw-1,x/gs|0)]/vmax;
    if(rng() < (1-wgt)+wgt*v) pts.push(x,y);
  }
  while(pts.length<n*2) pts.push(rng()*w,rng()*h);
  const del=new d3.Delaunay(new Float64Array(pts));
  const vor=del.voronoi([0,0,w,h]);
  const out=[], m=pts.length/2;
  for(let i=0;i<m;i++){
    const poly=vor.cellPolygon(i);
    if(!poly||poly.length<4)continue;
    // centroid + area
    let cx=0,cy=0,area=0;
    for(let j=0;j<poly.length-1;j++){
      const[ax,ay]=poly[j],[bx,by]=poly[j+1];
      const cr=ax*by-bx*ay; area+=cr; cx+=(ax+bx)*cr; cy+=(ay+by)*cr;
    }
    area/=2; if(Math.abs(area)<0.5)continue;
    cx/=6*area; cy/=6*area;
    const size=Math.sqrt(Math.abs(area));
    const col=pointAvg(cx,cy,Math.max(2,size*0.25));
    const mk=fillFor(cx,cy,size);
    if(S.voronoi.mode==='dots'){
      const r=Math.sqrt(Math.abs(area)/Math.PI)*(1-S.voronoi.gap/100)*0.92;
      if(r>0.4) out.push({kind:'circle',cx,cy,r,fill:mk(col)});
    }else{
      const s=1-S.voronoi.gap/100*0.9;
      const pts2=poly.slice(0,-1).map(([px,py])=>[cx+(px-cx)*s,cy+(py-cy)*s]);
      out.push({kind:'poly',pts:pts2,fill:mk(col)});
    }
  }
  return out;
}

function bgColor(){
  if(S.bg==='avg')return sample.avg;
  if(S.bg==='custom'){
    const c=S.bgCustom;
    return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  }
  return BG_COLORS[S.bg];
}

function rebuild(){
  if(!sample)return;
  if(S.paletteK>0 && !palette){
    palette=buildPalette(S.paletteK);
    if(S.harmony!=='off') palette=harmonizePalette(palette,S.harmony,S.harmonyAmt/100);
  }
  if(S.paletteK===0) palette=null;
  const rng=mulberry32(S.seed);
  shapes = S.style==='dots'?genDots(rng)
        : S.style==='mosaic'?genMosaic()
        : S.style==='quad'?genQuad()
        : genVoronoi(rng);
}

/* ============================ rendering ============================ */
const cv=document.getElementById('preview'), ctx=cv.getContext('2d');
function draw(){
  document.querySelector('.canvas-wrap').style.background=STAGE_BG[S.stageBg];
  if(!sample)return;
  const {w,h}=sample;
  const scale=Math.min(2,1600/Math.max(w,h));
  cv.width=Math.round(w*scale); cv.height=Math.round(h*scale);
  paint(ctx,scale);
  const label={dots:'dot grid',mosaic:'mosaic',quad:'quadtree',voronoi:'voronoi'}[S.style];
  document.getElementById('meta').innerHTML=
    `<b>${shapes.length.toLocaleString()}</b> shapes &middot; ${label}`+
    (palette?` &middot; ${palette.length} colours`:'')+` &middot; seed <b>${S.seed}</b>`;
  renderChips();
}
function paint(x,scale){
  const {w,h}=sample;
  x.setTransform(scale,0,0,scale,0,0);
  x.fillStyle=hex(bgColor()); x.fillRect(0,0,w,h);
  for(const s of shapes){
    x.fillStyle=fillStyle(x,s);
    x.beginPath();
    if(s.kind==='circle') x.arc(s.cx,s.cy,s.r,0,Math.PI*2);
    else if(s.kind==='rect'){
      if(s.rx>0.2) x.roundRect(s.x,s.y,s.w,s.h,Math.min(s.rx,s.w/2,s.h/2));
      else x.rect(s.x,s.y,s.w,s.h);
    }else{
      x.moveTo(s.pts[0][0],s.pts[0][1]);
      for(let i=1;i<s.pts.length;i++)x.lineTo(s.pts[i][0],s.pts[i][1]);
      x.closePath();
    }
    x.fill();
  }
}
function fillStyle(x,s){
  if(s.fill.c)return hex(s.fill.c);
  const g=s.fill.g, gr=x.createLinearGradient(g.x1,g.y1,g.x2,g.y2);
  gr.addColorStop(0,hex(g.c1)); gr.addColorStop(1,hex(g.c2));
  return gr;
}

let raf=0;
function schedule(full){
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(()=>{if(full)rebuild();draw()});
}

/* ============================= SVG out ============================= */
function toSVG(){
  const {w,h}=sample; let defs='',body='',gi=0;
  const P=v=>Math.round(v*100)/100;
  body+=`<rect width="${w}" height="${h}" fill="${hex(bgColor())}"/>`;
  for(const s of shapes){
    let fill;
    if(s.fill.c)fill=hex(s.fill.c);
    else{
      const g=s.fill.g,id='g'+(gi++);
      defs+=`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${P(g.x1)}" y1="${P(g.y1)}" x2="${P(g.x2)}" y2="${P(g.y2)}"><stop offset="0" stop-color="${hex(g.c1)}"/><stop offset="1" stop-color="${hex(g.c2)}"/></linearGradient>`;
      fill=`url(#${id})`;
    }
    if(s.kind==='circle')body+=`<circle cx="${P(s.cx)}" cy="${P(s.cy)}" r="${P(s.r)}" fill="${fill}"/>`;
    else if(s.kind==='rect')body+=`<rect x="${P(s.x)}" y="${P(s.y)}" width="${P(s.w)}" height="${P(s.h)}"${s.rx>0.2?` rx="${P(s.rx)}"`:''} fill="${fill}"/>`;
    else body+=`<polygon points="${s.pts.map(p=>P(p[0])+','+P(p[1])).join(' ')}" fill="${fill}"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}">`+
    (defs?`<defs>${defs}</defs>`:'')+body+`</svg>`;
}

function guideSVG(){
  const {w,h}=sample;
  const pal = palette || buildPalette(12);
  const idxOf=c=>{let bi=0,bd=1e9;pal.forEach((p,i)=>{
    const d=(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2;if(d<bd){bd=d;bi=i}});return bi};
  const P=v=>Math.round(v*100)/100;
  const fs=Math.max(6,w/110), minSize=fs*1.4;
  let body='';
  for(const s of shapes){
    const c=s.fill.c||s.fill.g.c1;
    const i=idxOf(c)+1;
    let cx,cy,size,el;
    if(s.kind==='circle'){cx=s.cx;cy=s.cy;size=s.r*2;
      el=`<circle cx="${P(cx)}" cy="${P(cy)}" r="${P(s.r)}"/>`}
    else if(s.kind==='rect'){cx=s.x+s.w/2;cy=s.y+s.h/2;size=Math.min(s.w,s.h);
      el=`<rect x="${P(s.x)}" y="${P(s.y)}" width="${P(s.w)}" height="${P(s.h)}"${s.rx>0.2?` rx="${P(s.rx)}"`:''}/>`}
    else{let sx=0,sy=0;s.pts.forEach(p=>{sx+=p[0];sy+=p[1]});cx=sx/s.pts.length;cy=sy/s.pts.length;
      let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
      s.pts.forEach(p=>{mnx=Math.min(mnx,p[0]);mny=Math.min(mny,p[1]);mxx=Math.max(mxx,p[0]);mxy=Math.max(mxy,p[1])});
      size=Math.min(mxx-mnx,mxy-mny);
      el=`<polygon points="${s.pts.map(p=>P(p[0])+','+P(p[1])).join(' ')}"/>`}
    body+=el;
    if(size>minSize)
      body+=`<text x="${P(cx)}" y="${P(cy+fs*0.35)}" font-size="${P(fs)}" text-anchor="middle">${i}</text>`;
  }
  // legend
  const cols=pal.length<=16?4:pal.length<=64?6:8;
  const sw=Math.min(w*0.055,(w/cols)*0.36), pad=sw*0.5, colW=w/cols;
  const showHex=cols<8;
  const rows=Math.ceil(pal.length/cols);
  const legendH=rows*(sw+pad)+pad*3.5;
  let legend=`<text x="${P(pad)}" y="${P(h+pad*1.8)}" font-size="${P(fs*1.1)}" font-weight="bold" fill="#333">PALETTE</text>`;
  pal.forEach((p,i)=>{
    const r=(i/cols)|0, cc=i%cols;
    const x=pad+cc*colW, y=h+pad*2.6+r*(sw+pad);
    legend+=`<rect x="${P(x)}" y="${P(y)}" width="${P(sw)}" height="${P(sw)}" fill="${hex(p)}" stroke="#444" stroke-width="0.5"/>`+
      `<text x="${P(x+sw/2)}" y="${P(y+sw*0.62)}" font-size="${P(Math.min(fs,sw*0.5))}" text-anchor="middle" fill="${lum(p)>140?'#222':'#eee'}" stroke="none">${i+1}</text>`+
      (showHex?`<text x="${P(x+sw*1.15)}" y="${P(y+sw*0.62)}" font-size="${P(fs*0.8)}" fill="#333" stroke="none">${hex(p)}</text>`:'');
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h+legendH+8}" font-family="Helvetica,Arial,sans-serif">`+
    `<defs><clipPath id="art"><rect width="${w}" height="${h}"/></clipPath></defs>`+
    `<rect width="${w}" height="${h+legendH+8}" fill="#ffffff"/>`+
    `<g clip-path="url(#art)" fill="none" stroke="#555" stroke-width="${Math.max(0.4,w/1600)}">${body.replace(/<text /g,'<text stroke="none" fill="#555" ')}</g>`+
    `<g>${legend}</g></svg>`;
}

/* ============================ downloads ============================ */
const dlReady=(window.claude&&window.claude.use)?claude.use('downloads').catch(()=>null):Promise.resolve(null);
async function deliver(filename,data){
  const ns=await Promise.race([dlReady,new Promise(r=>setTimeout(()=>r(null),4000))]);
  if(ns){
    try{await ns.save({filename,data});toast('Saved '+filename);return}
    catch(e){
      if(e&&e.code==='declined')return;
      if(e&&(e.code==='rate_limited')){toast('One save at a time — try again in a moment');return}
      // else fall through to anchor
    }
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data]);
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('Saved '+filename);
  }catch(e){toast('Could not save the file')}
}
function stamp(){return `${S.style}-${S.seed}`}
document.getElementById('exp-svg').onclick=()=>{if(sample)deliver(`dotsdaubs-${stamp()}.svg`,toSVG())};
document.getElementById('exp-guide').onclick=()=>{if(sample)deliver(`dotsdaubs-guide-${stamp()}.svg`,guideSVG())};
document.getElementById('exp-png').onclick=()=>{
  if(!sample)return;
  const {w,h}=sample, k=2400/Math.max(w,h);
  const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  paint(c.getContext('2d'),k);
  c.toBlob(b=>{if(b)deliver(`dotsdaubs-${stamp()}.png`,b)},'image/png');
};

let toastT=0;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);
}

  for(const g of CTRL){
    if(!g.always && g.style!==S.style)continue;
    const gd=document.createElement('div');gd.className='group';
    if(g.group!=='Style'){
      const gl=document.createElement('p');gl.className='group-label';gl.textContent=g.group;gd.appendChild(gl);
    }
    for(const it of g.items){
      if(it.showIf&&!it.showIf())continue;
      gd.appendChild(buildItem(it));
    }
    controlsEl.appendChild(gd);
  }
}
function buildItem(it){
  if(it.type==='tabs'){
    const t=document.createElement('div');t.className='tabs';t.setAttribute('role','tablist');
    [['dots','Dots'],['mosaic','Mosaic'],['quad','Quadtree'],['voronoi','Voronoi']].forEach(([v,l])=>{
      const b=document.createElement('button');b.textContent=l;
      b.className=S.style===v?'on':'';
      b.onclick=()=>{S.style=v;buildUI();schedule(true)};
      t.appendChild(b);
    });
    return t;
  }
  if(it.type==='chips'){
    const d=document.createElement('div');d.className='palette-chips';d.id='chips';return d;
  }
  const wrap=document.createElement('div');wrap.className='ctl';
  const head=document.createElement('div');head.className='ctl-head';
  const lab=document.createElement('label');lab.textContent=it.label;head.appendChild(lab);
  const val=document.createElement('span');val.className='val';head.appendChild(val);
  wrap.appendChild(head);
  const fmt=it.fmt||(v=>v);
  if(it.type==='range'){
    const r=document.createElement('input');r.type='range';
    r.min=it.min;r.max=it.max;r.step=it.step;r.value=get(it.key);
    val.textContent=fmt(+r.value);
    r.oninput=()=>{
      set(it.key,+r.value);val.textContent=fmt(+r.value);
      if(it.reset==='sample'){buildSample()}
      if(it.reset==='palette'){palette=null}
      if(it.key==='grad'){buildUI()}
      schedule(true);
      if(it.key==='paletteK'||it.reset==='sample')renderChips();
    };
    lab.htmlFor=r.id='ctl-'+it.key.replace('.','-');
    wrap.appendChild(r);
  }else if(it.type==='seg'){
    val.remove();
    const s=document.createElement('div');s.className='seg';
    s.style.gridTemplateColumns=`repeat(${it.grid||it.opts.length},1fr)`;
    it.opts.forEach(([v,l])=>{
      const b=document.createElement('button');b.textContent=l;
      b.className=get(it.key)===v?'on':'';
      b.onclick=()=>{set(it.key,v);
        if(it.key==='harmony'){
          if(v!=='off'&&S.paletteK===0)S.paletteK=12; // needs a palette to work on
          palette=null;buildUI();
        }
        else if(it.key==='grad'||it.key==='bg'){buildUI()}
        else{[...s.children].forEach(c=>c.className='');b.className='on'}
        schedule(true)};
      s.appendChild(b);
    });
    wrap.appendChild(s);
  }else if(it.type==='color'){
    val.remove();
    const c=document.createElement('input');c.type='color';c.value=get(it.key);
    c.oninput=()=>{set(it.key,c.value);schedule(true)};
    wrap.appendChild(c);
  }
  return wrap;
}
function renderChips(){
  const d=document.getElementById('chips');if(!d)return;
  d.innerHTML='';
  if(!palette){d.style.display='none';return}
  d.style.display='flex';
  const small=palette.length>24;
  palette.forEach((p,i)=>{
    const c=document.createElement('div');c.className=small?'chip small':'chip';
    c.style.background=hex(p);c.title=(i+1)+' · '+hex(p);
    c.style.color=lum(p)>140?'#00000090':'#ffffffb0';
    if(!small)c.textContent=i+1;
    d.appendChild(c);
  });
}

document.getElementById('btn-shuffle').onclick=()=>{
  S.seed=Math.floor(Math.random()*1e6);schedule(true);
};

/* ============================ load image =========================== */
function useImage(img){
  srcImage=img;buildSample();palette=null;schedule(true);
}
function loadFile(file){
  if(!file||!file.type.startsWith('image/')){toast('That doesn’t look like an image');return}
  createImageBitmap(file).then(useImage).catch(()=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{useImage(im);URL.revokeObjectURL(url)};
    im.src=url;
  });
}
document.getElementById('btn-upload').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>loadFile(e.target.files[0]);

let dragDepth=0;
addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;document.body.classList.add('dragging')});
addEventListener('dragleave',e=>{e.preventDefault();if(--dragDepth<=0){dragDepth=0;document.body.classList.remove('dragging')}});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{
  e.preventDefault();dragDepth=0;document.body.classList.remove('dragging');
  loadFile(e.dataTransfer.files[0]);
});
addEventListener('paste',e=>{
  const f=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));
  if(f)loadFile(f.getAsFile());
});

/* --------- procedural demo image: a headland at dusk --------- */
function demoImage(){
  const w=640,h=460,c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');
  const sky=x.createLinearGradient(0,0,0,h*0.62);
  sky.addColorStop(0,'#2b3a6e');sky.addColorStop(0.45,'#8a5f8f');
  sky.addColorStop(0.78,'#e0774f');sky.addColorStop(1,'#f5b04c');
  x.fillStyle=sky;x.fillRect(0,0,w,h*0.62);
  // sun
  const sun=x.createRadialGradient(w*0.68,h*0.5,4,w*0.68,h*0.5,90);
  sun.addColorStop(0,'#fff3c8');sun.addColorStop(0.35,'#ffd47a');sun.addColorStop(1,'rgba(255,180,90,0)');
  x.fillStyle=sun;x.fillRect(0,0,w,h*0.62);
  x.fillStyle='#ffe9a8';x.beginPath();x.arc(w*0.68,h*0.5,26,0,7);x.fill();
  // clouds
  x.fillStyle='rgba(120,80,120,0.45)';
  [[0.15,0.16,150,10],[0.45,0.11,120,8],[0.25,0.3,220,12],[0.7,0.22,140,9]].forEach(([px,py,cw,chh])=>{
    x.beginPath();x.ellipse(w*px,h*py,cw/2,chh,0,0,7);x.fill();
  });
  // sea
  const sea=x.createLinearGradient(0,h*0.62,0,h);
  sea.addColorStop(0,'#e28a52');sea.addColorStop(0.25,'#9a6277');sea.addColorStop(1,'#232a52');
  x.fillStyle=sea;x.fillRect(0,h*0.62,w,h*0.38);
  // sun path on water
  x.fillStyle='rgba(255,210,120,0.55)';
  for(let i=0;i<14;i++){
    const yy=h*0.63+i*(h*0.36/14);
    const ww=30+i*3+Math.sin(i*2.7)*10;
    x.fillRect(w*0.68-ww/2,yy,ww,4);
  }
  // headlands
  x.fillStyle='#2c2340';
  x.beginPath();x.moveTo(0,h*0.62);
  x.quadraticCurveTo(w*0.1,h*0.38,w*0.28,h*0.62);x.closePath();x.fill();
  x.fillStyle='#1d1730';
  x.beginPath();x.moveTo(w*0.75,h*0.62);
  x.quadraticCurveTo(w*0.9,h*0.46,w,h*0.55);x.lineTo(w,h*0.62);x.closePath();x.fill();
  // foreground rocks
  x.fillStyle='#171126';
  x.beginPath();x.moveTo(0,h);x.lineTo(0,h*0.86);
  x.quadraticCurveTo(w*0.2,h*0.8,w*0.34,h);x.closePath();x.fill();
  return c;
}

buildUI();
useImage(demoImage());
if(!(window.d3&&d3.Delaunay))
  setTimeout(()=>{if(!(window.d3&&d3.Delaunay))toast('Voronoi library didn’t load — other styles still work')},3000);
</script>
